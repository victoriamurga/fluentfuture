<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up | Fluent Future</title>
    <link rel="stylesheet" href="styles.css?v=1.3" />
  </head>
  <body>
    <div id="header"></div>
    <main class="sign-up-page">
      <div class="sign-in-form">
        <h1>Create an Account</h1>
        <form id="sign-in-form">
          <label for="email">Email:</label><br />
          <input type="email" name="email" placeholder="Email" required /><br /><br />

          <label for="password">Password:</label><br />
          <input type="password" name="password" placeholder="Password" required /><br /><br />

          <button type="submit" class="sign-in-button">Sign Up</button>
          <p id="sign-up-message"></p>
        </form>
        <p>Already have an account? <a href="sign-in.html">Sign In</a></p>
      </div>
    </main>

    <footer>
      <div class="container">
        <p>&copy; 2025 Fluent Future. Brought to you by Murha Viktoriia.</p>
        <nav>
          <ul class="footer-nav">
            <li><a href="level-test.html">Level Test</a></li>
            <li><a href="lessons.html">Lessons</a></li>
            <li><a href="https://fluentfutureblog.blogspot.com">Blog</a></li>
            <li><a href="dashboard.html">Learner Profile</a></li>
          </ul>
        </nav>
      </div>
    </footer>

    <!-- Firebase App (core SDK) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>

    <!-- Firebase Auth -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

    <script type="module">
      import { auth } from './firebase-config.js';
      import { createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js';

      document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('sign-up-form');
        const message = document.getElementById('sign-up-message');

        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const email = form.email.value;
          const password = form.password.value;

          createUserWithEmailAndPassword(auth, email, password)
            .then((userCredential) => {
              message.textContent = 'Account created! Redirecting...';
              setTimeout(() => (window.location.href = 'dashboard.html'), 1500);
            })
            .catch((error) => {
              message.textContent = 'Error: ' + error.message;
            });
        });
      });
    </script>

    <script src="script.js"></script>
  </body>
</html>
