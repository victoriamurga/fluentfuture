<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign up | Fluent Future</title>
    <link rel="stylesheet" href="styles.css?v=1.3" />
  </head>
  <body>
    <div id="header"></div>
    <main class="sign-up-page">
      <div class="sign-up-form">
        <h1>Create an Account</h1>
        <form id="sign-up-form">
          <label for="email">Email:</label><br />
          <input type="email" name="email" placeholder="Email" required /><br /><br />

          <label for="password">Password:</label><br />
          <input type="password" name="password" placeholder="Password" required /><br /><br />

          <button type="submit" class="sign-in-button">Sign Up</button>
          <p id="sign-up-message"></p>
        </form>
        <p>Already have an account? <a href="sign-in.html">Sign In</a></p>
      </div>
    </main>

    <footer>
      <div class="container">
        <p>&copy; 2025 Fluent Future. Brought to you by Murha Viktoriia.</p>
        <nav>
          <ul class="footer-nav">
            <li><a href="level-test.html">Level Test</a></li>
            <li><a href="lessons.html">Lessons</a></li>
            <li><a href="https://fluentfutureblog.blogspot.com">Blog</a></li>
            <li><a href="dashboard.html">Learner Profile</a></li>
          </ul>
        </nav>
      </div>
    </footer>

    <script type="module">
      import { doc, setDoc } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js';

      import { auth } from './firebase-config.js';
      import { createUserWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js';
      import { db } from './firebase-config.js';

      document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('sign-up-form');
        const message = document.getElementById('sign-up-message');

        form.addEventListener('submit', async (e) => {
          e.preventDefault();
          const emailInput = form.querySelector('input[name="email"]');
          const passwordInput = form.querySelector('input[name="password"]');

          const email = emailInput.value;
          const password = passwordInput.value;

          message.textContent = 'Processing...';
          message.style.color = 'orange';

          try {
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            await setDoc(doc(db, 'users', user.uid), {
              email: user.email,
              createdAt: new Date(),
              level: 'A1',
              progress: 0,
            });

            console.log('User + Firestore profile created:', user.uid);

            message.textContent = 'Account created successfully! Redirecting...';
            message.style.color = 'green';

            setTimeout(() => {
              window.location.href = 'dashboard.html';
            }, 1500);
          } catch (error) {
            console.error('Firebase Sign Up Error:', error);

            let errorMessage = 'An unknown error occurred.';
            if (error.code) {
              // Map common Firebase error codes to user-friendly messages
              switch (error.code) {
                case 'auth/email-already-in-use':
                  errorMessage = 'This email address is already registered.';
                  break;
                case 'auth/invalid-email':
                  errorMessage = 'Please enter a valid email address.';
                  break;
                case 'auth/weak-password':
                  errorMessage = 'Password must be at least 6 characters long.';
                  break;
                default:
                  errorMessage = `Error: ${error.message}`;
              }
            }
            message.textContent = errorMessage;
            message.style.color = 'red';
          }
        });
      });
    </script>

    <script type="module" src="script.js"></script>
  </body>
</html>
