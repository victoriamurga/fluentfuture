<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | Fluent Future</title>
    <link rel="stylesheet" href="styles.css?v=1.3" />
  </head>
  <body>
    <div id="header"></div>

    <main class="sign-in-page">
      <section class="sign-in-form">
        <h1>Sign In to Fluent Future</h1>
        <form id="sign-in-form">
          <label for="email">Email:</label><br />
          <input type="email" id="email" name="email" required /><br /><br />

          <label for="password">Password:</label><br />
          <input type="password" id="password" name="password" required /><br /><br />

          <button type="submit" class="sign-in-button">Sign In</button>
        </form>
        <p id="sign-in-message" class="hidden">Signing in...</p>
        <p>No account? <a href="sign-up.html">Sign Up</a></p>
      </section>
    </main>

    <footer>
      <div class="container">
        <p>&copy; 2025 Fluent Future. Brought to you by Murha Viktoriia.</p>
        <nav>
          <ul class="footer-nav">
            <li><a href="level-test.html">Level Test</a></li>
            <li><a href="lessons.html">Lessons</a></li>
            <li><a href="https://fluentfutureblog.blogspot.com">Blog</a></li>
            <li><a href="dashboard.html">Learner Profile</a></li>
          </ul>
        </nav>
      </div>
    </footer>

    <!-- Firebase App (core SDK) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>

    <!-- Firebase Auth -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

    <script type="module">
      import { auth } from './firebase-config.js';
      import {
        signInWithEmailAndPassword,
        onAuthStateChanged,
      } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js';

      document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('sign-in-form');
        const message = document.getElementById('sign-in-message');

        // Redirect if already signed in
        onAuthStateChanged(auth, (user) => {
          if (user) {
            window.location.href = 'dashboard.html';
          }
        });

        form.addEventListener('submit', (e) => {
          e.preventDefault();
          const email = form.email.value;
          const password = form.password.value;

          signInWithEmailAndPassword(auth, email, password)
            .then(() => {
              window.location.href = 'dashboard.html';
            })
            .catch((error) => {
              message.textContent = 'Error: ' + error.message;
            });
        });
      });
    </script>

    <script src="script.js"></script>
  </body>
</html>
