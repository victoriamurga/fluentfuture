<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In | Fluent Future</title>
    <link rel="stylesheet" href="styles.css?v=1.3" />
  </head>

  <body>
    <div id="header"></div>

    <main class="sign-in-page">
      <section class="sign-in-form">
        <h1>Sign In to Fluent Future</h1>

        <form id="sign-in-form">
          <label for="email">Email:</label><br />
          <input type="email" id="email" name="email" required /><br /><br />

          <label for="password">Password:</label><br />
          <input type="password" id="password" name="password" required /><br /><br />

          <button type="submit" class="sign-in-button">Sign In</button>
        </form>

        <p id="sign-in-message"></p>

        <p>No account? <a href="sign-up.html">Sign Up</a></p>
      </section>
    </main>

    <div id="footer"></div>

    <!-- ✅ SINGLE modular script block -->
    <script type="module">
      import { auth } from './firebase-config.js';
      import {
        signInWithEmailAndPassword,
        setPersistence,
        browserLocalPersistence,
        onAuthStateChanged,
      } from 'https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js';

      document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('sign-in-form');
        const message = document.getElementById('sign-in-message');

        // ✅ If already logged in → redirect
        onAuthStateChanged(auth, (user) => {
          if (user) {
            window.location.href = 'dashboard.html';
          }
        });

        // ✅ Handle login
        form.addEventListener('submit', async (e) => {
          e.preventDefault();

          const email = form.email.value;
          const password = form.password.value;

          message.textContent = 'Signing in...';

          try {
            // 🔑 Ensure persistence BEFORE login
            await setPersistence(auth, browserLocalPersistence);

            const userCredential = await signInWithEmailAndPassword(auth, email, password);

            console.log('Logged in:', userCredential.user);

            window.location.href = 'dashboard.html';
          } catch (error) {
            console.error(error);
            message.textContent = 'Error: ' + error.message;
          }
        });
      });
    </script>

    <!-- Your main app script -->
    <script type="module" src="script.js"></script>
  </body>
</html>
