<body>




<main class="dashboard-page">
  <section class="dashboard-box">
    <h1>Welcome!</h1>
    <p>You are signed in as <strong id="user-email">...</strong></p>
	
	<p>Your User Level: (<span id="user-level"></span>)</p>
	
    <button id="sign-out-button" class="auth-button">Sign Out</button>
  </section>
  
  
  
  <section>
  <div id="test-progress"></div>
  <section/>

<!-- Firebase App (core SDK) -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>

<!-- Firebase Auth -->
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>

<script type="module">
import { auth, db } from './firebase-config.js';
import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";
import { doc, getDoc } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";

document.addEventListener('DOMContentLoaded', () => {
  const emailSpan = document.getElementById('user-email');
  const levelSpan = document.getElementById('user-level');
  const testProgressContainer = document.getElementById('test-progress');
  const signOutBtn = document.getElementById('sign-out-button');

  onAuthStateChanged(auth, async (user) => {
    if (!user) {
      // Not signed in, redirect
      window.location.href = 'sign-in.html';
      return;
    }

    // Display user email
    emailSpan.textContent = user.email;

    // Fetch user data from Firestore
    const userDocRef = doc(db, "users", user.uid);
    const userDocSnap = await getDoc(userDocRef);

    if (userDocSnap.exists()) {
      const userData = userDocSnap.data();

      levelSpan.textContent = userData.level || 'Level not set';

      // Show test results
      const testResults = userData.testResults || {};
      testProgressContainer.innerHTML = "<h3>Your Test Progress</h3>";

      if (Object.keys(testResults).length === 0) {
        testProgressContainer.innerHTML += "<p>No tests taken yet.</p>";
      } else {
        const ul = document.createElement("ul");
        for (const testName in testResults) {
          const { score, date } = testResults[testName];
          const li = document.createElement("li");
          li.textContent = `${testName}: ${score}/10 (Last taken: ${date})`;
          ul.appendChild(li);
        }
        testProgressContainer.appendChild(ul);
      }
    } else {
      levelSpan.textContent = 'Level not set';
      testProgressContainer.innerHTML = "<h3>Your Test Progress</h3><p>No tests taken yet.</p>";
    }
  });

  signOutBtn?.addEventListener('click', () => {
    signOut(auth).then(() => {
      window.location.href = 'sign-in.html';
    });
  });
});
</script>
  
  
  
    <script src="script.js"></script>
  
  
</body>
</html>
